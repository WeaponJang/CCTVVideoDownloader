<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CCTV 视频解析下载器</title>
    <style>
        :root {
            --primary: #c62828;
            --primary-hover: #b71c1c;
            --bg: #f5f5f5;
            --card: #fff;
            --border: #e0e0e0;
            --text: #212121;
            --text-secondary: #666;
            --code-bg: #263238;
            --success: #2e7d32;
            --warning: #f57c00;
            --error: #d32f2f;
            --orange: #f86336;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== 顶部工具栏 ===== */
        .toolbar {
            background: linear-gradient(135deg, #c62828 0%, #e53935 100%);
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            -webkit-app-region: drag;
        }
        .toolbar h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
        .toolbar .subtitle { font-size: 12px; opacity: 0.85; margin-top: 2px; }
        .toolbar .spacer { flex: 1; }
        .toolbar button {
            -webkit-app-region: no-drag;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        .toolbar button:hover { background: rgba(255,255,255,0.35); }

        /* ===== 主内容区 ===== */
        .main-content { flex: 1; overflow-y: auto; padding: 20px 24px; }

        /* ===== 输入区域 ===== */
        .input-section {
            background: var(--card);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .input-row { display: flex; gap: 12px; align-items: center; }
        .input-row input {
            flex: 1; padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px; font-size: 14px; outline: none;
            transition: border-color 0.3s;
        }
        .input-row input:focus { border-color: var(--primary); }

        .btn {
            padding: 12px 24px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 14px; font-weight: 600;
            transition: all 0.2s; white-space: nowrap;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #1b5e20; }
        .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-outline:hover { background: var(--primary); color: #fff; }
        .btn-orange { background: var(--orange); color: #fff; }
        .btn-orange:hover { background: #e05520; }
        /* ===== 结果卡片 ===== */
        .result-section {
            background: var(--card); border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            margin-bottom: 20px; overflow: hidden;
        }
        .result-header {
            background: #eceff1; padding: 12px 20px;
            font-weight: 700; color: #37474f; font-size: 14px;
            display: flex; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border);
        }
        .result-header .badge {
            background: var(--primary); color: #fff;
            font-size: 11px; padding: 2px 8px;
            border-radius: 10px; font-weight: 500;
        }
        .result-body { padding: 16px 20px; }

        /* ===== 视频信息 ===== */
        .video-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
        }
        .info-item {
            background: #fafafa; padding: 10px 14px;
            border-radius: 6px; border: 1px solid #eee;
        }
        .info-item .label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
        .info-item .value { font-size: 14px; font-weight: 600; word-break: break-all; }

        /* ===== 清晰度列表 ===== */
        .quality-list { display: flex; flex-direction: column; gap: 8px; }
        .quality-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; background: #fafafa;
            border: 1px solid #eee; border-radius: 8px;
            transition: all 0.2s;
        }
        .quality-item:hover { border-color: var(--primary); background: #fff3f3; }
        .quality-item .q-name {
            font-weight: 700; font-size: 14px; min-width: 90px;
            color: var(--primary);
        }
        .quality-item .q-bitrate {
            font-size: 11px; color: var(--text-secondary);
            min-width: 60px;
        }
        .quality-item .q-url {
            flex: 1; font-size: 11px; color: var(--text-secondary);
            word-break: break-all;
            font-family: 'Fira Code', 'Consolas', monospace;
        }
        .quality-item .q-actions { display: flex; gap: 6px; }
        .quality-item .q-actions button {
            padding: 5px 10px; font-size: 11px;
            border-radius: 5px; border: none;
            cursor: pointer; font-weight: 600;
        }
        .btn-copy { background: #e3f2fd; color: #1565c0; }
        .btn-copy:hover { background: #bbdefb; }
        .btn-download { background: var(--success); color: #fff; }
        .btn-download:hover { background: #1b5e20; }

        /* ===== 进度条 ===== */
        .progress-container { margin-top: 12px; display: none; }
        .progress-bar-bg {
            width: 100%; height: 24px; background: #e0e0e0;
            border-radius: 12px; overflow: hidden; position: relative;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #c62828, #ef5350);
            border-radius: 12px; width: 0%; transition: width 0.5s ease;
        }
        .progress-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px; font-weight: 700; color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .progress-detail { font-size: 12px; color: var(--text-secondary); margin-top: 6px; text-align: center; }

        /* ===== 日志区域 ===== */
        .log-section {
            background: var(--code-bg); border-radius: 10px;
            overflow: hidden; margin-bottom: 20px;
        }
        .log-header {
            background: #1a2327; padding: 10px 20px;
            font-size: 13px; color: #80cbc4; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
        }
        .log-body {
            padding: 14px 20px; max-height: 200px; overflow-y: auto;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 12px; line-height: 1.7; color: #b0bec5;
        }
        .log-body .log-info { color: #80cbc4; }
        .log-body .log-warn { color: #ffb74d; }
        .log-body .log-error { color: #ef5350; }
        .log-body .log-success { color: #66bb6a; }

        /* ===== 保存路径 ===== */
        .save-path-bar {
            background: #e8f5e9; border: 1px solid #a5d6a7;
            padding: 10px 16px; border-radius: 8px;
            margin-bottom: 16px; display: flex; align-items: center; gap: 10px; font-size: 13px;
        }
        .save-path-bar .path-text { flex: 1; word-break: break-all; color: #2e7d32; font-family: monospace; }

        /* ===== 当前任务状态 ===== */
        .task-bar {
            background: #fff3e0; border: 1px solid #ffcc80;
            padding: 10px 16px; border-radius: 8px;
            margin-bottom: 16px; font-size: 13px;
            display: flex; align-items: center; gap: 10px;
        }
        .task-bar .task-info { flex: 1; color: #e65100; font-weight: 600; }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c62828; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b71c1c; }
    </style>
</head>
<body>

<!-- 顶部工具栏 -->
<div class="toolbar">
    <div>
        <h1>📺 CCTV 视频解析下载器</h1>
        <div class="subtitle">整合 GreasyFork #558396 · NW.js 桌面版 · 保留原版 API 逻辑</div>
    </div>
    <div class="spacer"></div>
    <button onclick="chooseSaveDir()">📁 保存目录</button>

</div>

<!-- 主内容 -->
<div class="main-content">

    <!-- 输入区域 -->
    <div class="input-section">
        <div class="input-row">
            <input type="text" id="urlInput" placeholder="粘贴 CCTV 播放页 URL (含 VIDE/ARTI 的 .shtml 页面)" value="">
            <button class="btn btn-primary" id="parseBtn" onclick="startParse()">🔍 获取视频信息</button>

        <div class="result-body">
            <div class="video-info-grid" id="videoInfoGrid"></div>

    <!-- 清晰度列表 -->

                    <div class="progress-bar-fill" id="progressFill"></div>
                    <div class="progress-text" id="progressText">0%</div>

    <!-- 日志 -->
    <div class="log-section">
        <div class="log-header">📝 运行日志</div>

            <div class="log-info">[就绪] 等待输入 CCTV 视频 URL...</div>
        </div>

</div>

<!-- ===== 核心逻辑 ===== -->
<script>
// ============================================================
// 工具函数
// ============================================================
const $ = id => document.getElementById(id);
const log = (msg, type = 'info') => {
    const el = $('logBody');
    const time = new Date().toLocaleTimeString('zh-CN', {hour12:false});
    const div = document.createElement('div');
    div.className = `log-${type}`;
    div.textContent = `[${time}] ${msg}`;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    // 同时输出到控制台方便调试
    console.log(`[${type}] ${msg}`);
};

// Node 模块
const fs = require('fs');
const path = require('path');
const https = require('https');
const http = require('http');
const { execSync, spawn } = require('child_process');

// 全局状态
let saveDir = '';
let apiData = null;          // getHttpVideoInfo.do 返回的完整 JSON
let currentQualities = [];    // 解析出的清晰度列表
let isDownloading = false;
let currentTitle = '';
const appDir = path.dirname(process.execPath);
// 默认保存目录
saveDir = path.join(process.env.HOME || process.env.USERPROFILE, 'Downloads');
if (!fs.existsSync(saveDir)) {
    try { fs.mkdirSync(saveDir, { recursive: true }); } catch(e) {}
}
updateSavePathUI();

function updateSavePathUI() {
    $('savePathBar').style.display = 'flex';
    $('savePathText').textContent = saveDir;
}

function chooseSaveDir() {
    const { dialog } = require('nw.gui');
    dialog.showOpenDialog({
        title: '选择视频保存目录',
        defaultPath: saveDir,
        properties: ['openDirectory']
    }).then(result => {
        if (result && result.filePaths && result.filePaths.length > 0) {
            saveDir = result.filePaths[0];
            updateSavePathUI();
            log(`保存目录已更新: ${saveDir}`, 'success');
        }
    }).catch(err => log(`选择目录失败: ${err.message}`, 'error'));
}

function toggleDevTools() {
    require('nw.gui').Window.get().showDevTools();
}

// 文件名清洗 (照搬油猴脚本的非法字符列表)
function cleanFilename(s) {
    return s.replace(/[\u005c\u002f\u003a\u002a\u003f\u003c\u003e\u007c\u0020\u0022\u0027\u3000\uff02\uff07]/g, '_');
}

// ============================================================
// 第一步: 从播放页 URL 提取 VID/GUID
// 保留用户原版逻辑: 优先从页面 JS 变量提取, 失败则解析 URL
// ============================================================
async function extractGuidFromPage(pageUrl) {
    // 尝试从 URL 直接提取 VID
    let vid = null;
    try {
        const u = new URL(pageUrl);
        const parts = u.pathname.split('/');
        for (const p of parts) {
            if (/^(VIDE|ARTI)[A-Za-z0-9]+/i.test(p.replace('.shtml',''))) {
                vid = p.replace('.shtml','');
                break;
            }
        }
        if (!vid) {
            vid = u.searchParams.get('vid') || u.searchParams.get('VID') || u.searchParams.get('guid');
        }
    } catch(e) {}

    if (!vid) throw new Error('无法从 URL 提取 VID, 请确认是 CCTV 播放页链接');

    log(`提取到 VID: ${vid}`);

    // 用 VID 调 Article/newContentInfo 拿 guid
    const infoApi = `https://api.cntv.cn/Article/newContentInfo?serviceId=tvcctv&id=${vid}`;
    log(`请求内容信息: ${infoApi}`);

    const infoRes = await fetch(infoApi);
    const infoJson = await infoRes.json();

    if (!infoJson || !infoJson.data || !infoJson.data.guid) {
        throw new Error('内容信息接口未返回 guid');
    }

    const guid = infoJson.data.guid;
    log(`获取 GUID: ${guid}`, 'success');

    return {
        vid,
        guid,
        title: infoJson.data.title || infoJson.data.shorttitle || vid,
        publishTime: infoJson.data.publishTime || '',
        author: infoJson.data.author || '',
        summary: infoJson.data.description || infoJson.data.summary || '',
        videoLength: infoJson.data.videoLength || 0,
        templateType: infoJson.data.template_type || 0
    };
}

// ============================================================
// 第二步: 调 getHttpVideoInfo.do (原版 API 逻辑完整保留)
// ============================================================
async function fetchVideoApi(guid) {
    const params = {
        pid: guid,
        client: 'html5',
        tai: 'ipad',
        tsp: Math.floor(Date.now() / 1000).toString(),
        vn: '2049',
        uid: '826D8646DEBBFD97A82D23CAE45A55BE',
        wlan: ''
    };
    const sps = new URLSearchParams();
    Object.entries(params).forEach(([key, value]) => {
        if (value !== null && value !== undefined) sps.append(key, value);
    });

    const apiUrl = `https://vdn.apps.cntv.cn/api/getHttpVideoInfo.do?${sps.toString()}`;
    log(`请求视频接口: ${apiUrl}`);

    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error(`API 请求失败: HTTP ${res.status}`);

    const data = await res.json();
    log(`API 返回成功, title: ${data.title || 'N/A'}`, 'success');
    return data;
}

// ============================================================
// 第三步: 清晰度选择 (照搬油猴脚本的频道判断逻辑, 恒定 h5e)
// ============================================================
// 恒定使用 h5e 接口 (不再切换 enc2, 不再替换 CDN)
// ============================================================
function buildQualityList(apiData, templateType) {
    const qualities = [];

    // --- h5e 加密接口 (恒定使用) ---
    const h5eUrl = apiData.manifest?.hls_h5e_url || null;

    // --- 未加密 hls_url (备用) ---
    const hlsUrl = apiData.hls_url;
    if (h5eUrl) {
        log(`使用 h5e 接口: ${h5eUrl}`, 'success');
    } else {
        log(`h5e 接口不可用, 将仅使用未加密 URL`, 'warn');
    }

    // --- 根据频道和 validChapterNum 生成多码率选项 ---
    const playChannel = apiData.play_channel || '';
    const brtnum = apiData.video?.validChapterNum || 0;
    const totalLength = Number(apiData.video?.totalLength || 0);

    log(`频道: ${playChannel}, validChapterNum: ${brtnum}, 总时长: ${totalLength}s`);

    // 码率档位 (照搬油猴脚本)
    const brt = [450, 850, 1200, 2000, 4000, 3000];

    // 加密流 URL 基础 (h5e)
    const encBase = h5eUrl;
    // 未加密流 URL 基础 (hls_url)
    const unencBase = hlsUrl;

    // 基础 URL: 优先 h5e, 降级 hls_url (用于兜底判断)
    let baseForBitrate = h5eUrl || hlsUrl;
    if (!baseForBitrate) return qualities;

    // ========== CCTV-4K 频道 ==========
    if (playChannel.indexOf("CCTV-4K") == 0) {
        // 加密流: 2000k + 4000k
        if (encBase) {
            for (const br of [brt[3], brt[4]]) { // 2000, 4000
                const testUrl = encBase.replaceAll("main", br);
                qualities.push({
                    name: `加密 ${br}k`,
                    url: testUrl,
                    type: 'hls',
                    bitrate: br,
                    source: 'bitrate-select',
                    guid: extractGuidFromUrl(encBase)
                });
            }
        }
        // 未加密流: 仅 4000k
        if (unencBase) {
            const br = brt[4]; // 4000
            const testUrl = unencBase.replaceAll("main", br);
            qualities.push({
                name: `未加密 ${br}k`,
                url: testUrl,
                type: 'hls',
                bitrate: br,
                source: 'bitrate-unenc'
            });
        }
        log(`CCTV-4K 频道: 加密 2000k/4000k + 未加密 4000k`);
    }
    // ========== CCTV-16 频道 ==========
    else if (playChannel.indexOf("CCTV-16") == 0) {
        // 加密流: 2000k + 3000k
        if (encBase) {
            for (const br of [brt[3], brt[5]]) { // 2000, 3000
                const testUrl = encBase.replaceAll("main", br);
                qualities.push({
                    name: `加密 ${br}k`,
                    url: testUrl,
                    type: 'hls',
                    bitrate: br,
                    source: 'bitrate-select',
                    guid: extractGuidFromUrl(encBase)
                });
            }
        }
        // 未加密流: 仅 3000k
        if (unencBase) {
            const br = brt[5]; // 3000
            const testUrl = unencBase.replaceAll("main", br);
            qualities.push({
                name: `未加密 ${br}k`,
                url: testUrl,
                type: 'hls',
                bitrate: br,
                source: 'bitrate-unenc'
            });
        }
        log(`CCTV-16 频道: 加密 2000k/3000k + 未加密 3000k`);
    }
    // ========== 其他频道: 保留原版逻辑 ==========
    else {
        let selectedBitrates = [];
        let unencBrList = [];

        if (brtnum > 3) {
            selectedBitrates = [brt[3], brt[2], brt[1]];
            // template_type === 2 时用 2000k 未加密流, 否则用 850k
            const tplType = Number(templateType) || 0;
            if (tplType === 2) {
                unencBrList = [brt[3]]; // 2000k
                log(`多章节(brtnum=${brtnum}), template_type=${tplType}, 未加密使用 ${brt[3]}k`);
            } else {
                unencBrList = [brt[1]]; // 850k
                log(`多章节(brtnum=${brtnum}), template_type=${tplType}, 未加密使用 ${brt[1]}k`);
            }
            log(`多章节(brtnum=${brtnum}), 提供 ${selectedBitrates.join('/')}k`);
        } else if (brtnum === 1) {
            // 单章节: 使用最低码率 450k
            selectedBitrates = [brt[0]];
            unencBrList = [brt[0]];
            log(`单章节(brtnum=1), 选择 ${brt[0]}k`);
        } else if (brtnum === 2) {
            selectedBitrates = [brt[1]];
            unencBrList = [brt[1]];
            log(`两章节(brtnum=2), 选择 ${brt[1]}k`);
        } else if (brtnum > 0) {
            // 0 < brtnum < 3 且不是 1 或 2 的情况 (兜底)
            selectedBitrates = [brt[2]];
            unencBrList = [brt[2]];
            log(`少章节(brtnum=${brtnum}), 选择 ${brt[2]}k`);
        } else {
            selectedBitrates = [brt[0]];
            unencBrList = [brt[0]];
            log(`默认选择 ${brt[0]}k`);
        }

        // 加密流 (h5e)
        if (encBase) {
            for (const br of selectedBitrates) {
                const testUrl = encBase.replaceAll("main", br);
                qualities.push({
                    name: `加密 ${br}k`,
                    url: testUrl,
                    type: 'hls',
                    bitrate: br,
                    source: 'bitrate-select',
                    guid: extractGuidFromUrl(encBase)
                });
            }
        }

        // 未加密流 (hls_url)
        if (unencBase) {
            for (const br of unencBrList) {
                const testUrl = unencBase.replaceAll("main", br);
                qualities.push({
                    name: `未加密 ${br}k`,
                    url: testUrl,
                    type: 'hls',
                    bitrate: br,
                    source: 'bitrate-unenc'
                });
            }
        }

        log(`其他频道, 加密: ${selectedBitrates.join('/')}k, 未加密: ${unencBrList.join('/')}k`);
    }

    return qualities;
}

function extractGuidFromUrl(url) {
    try {
        const u = new URL(url);
        const parts = u.pathname.split('/');
        // h5e URL 格式: /vod/.../{guid}/{bitrate}.m3u8
        return parts[10] || parts[parts.length - 2] || '';
    } catch(e) {
        return '';
    }
}

// ============================================================
// 主流程: 解析
// ============================================================
async function startParse() {
    const url = $('urlInput').value.trim();
    if (!url) { log('请输入 CCTV 视频 URL', 'warn'); return; }

    $('parseBtn').disabled = true;
    $('parseBtn').textContent = '解析中...';

    try {
        // 1. 提取 GUID
        const pageInfo = await extractGuidFromPage(url);
        currentTitle = pageInfo.title;

        // 2. 调视频 API
        const data = await fetchVideoApi(pageInfo.guid);
        apiData = data;

        // 3. 构建清晰度列表 (恒定 h5e)
        const qualities = buildQualityList(data, pageInfo.templateType);
        currentQualities = qualities;

        // 4. 渲染
        renderVideoInfo({
            title: data.title || pageInfo.title,
            guid: pageInfo.guid,
            vid: pageInfo.vid,
            playChannel: data.play_channel || '',
            totalLength: data.video?.totalLength || pageInfo.videoLength,
            brtnum: data.video?.validChapterNum || 0,
            publishTime: pageInfo.publishTime,
            author: pageInfo.author
        });

        renderQualities(qualities);

        $('apiBadge').textContent = 'H5E';
        $('qualityCount').textContent = `${qualities.length} 个选项`;

        log(`解析完成! 标题: ${currentTitle}`, 'success');

    } catch(e) {
        log(`解析失败: ${e.message}`, 'error');
        console.error(e);
    } finally {
        $('parseBtn').disabled = false;
        $('parseBtn').textContent = '🔍 获取视频信息';
    }
}

// ============================================================
// 渲染
// ============================================================
function renderVideoInfo(info) {
    $('videoInfoSection').style.display = 'block';
    const grid = $('videoInfoGrid');
    grid.innerHTML = '';

    const items = [
        { label: '标题', value: info.title },
        { label: 'GUID', value: info.guid },
        { label: 'VID', value: info.vid },
        { label: '频道', value: info.playChannel || '-' },
        { label: '时长', value: info.totalLength ? `${Math.round(info.totalLength/60)} 分钟` : '-' },
        { label: '章节数', value: info.brtnum || '-' },
    ];

    for (const item of items) {
        const div = document.createElement('div');
        div.className = 'info-item';
        div.innerHTML = `<div class="label">${item.label}</div><div class="value">${escapeHtml(item.value)}</div>`;
        grid.appendChild(div);
    }
}

function renderQualities(qualities) {
    $('qualitySection').style.display = 'block';
    const list = $('qualityList');
    list.innerHTML = '';

    // 排序: 按码率降序 (高码率优先)
    qualities.sort((a, b) => {
        return (b.bitrate || 0) - (a.bitrate || 0);
    });

    for (let i = 0; i < qualities.length; i++) {
        const q = qualities[i];
        const div = document.createElement('div');
        div.className = 'quality-item';
        div.innerHTML = `
            <div class="q-name">${escapeHtml(q.name)}</div>
            <div class="q-bitrate">${q.bitrate ? q.bitrate+'k' : '-'}</div>
            <div class="q-url">${escapeHtml(q.url)}</div>
            <div class="q-actions">
                <button class="btn-copy" onclick="copyText('${escapeJs(q.url)}')">📋</button>
                <button class="btn-download" onclick="startDownload(${i})">⬇️ 下载</button>
            </div>
        `;
        list.appendChild(div);
    }
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeJs(s) {
    return String(s).replace(/'/g, "\\'").replace(/"/g, '\\"');
}

function copyText(text) {
    require('nw.gui').Clipboard.get().set(text, 'text');
    log('已复制链接到剪贴板', 'success');
}

// ============================================================
// 下载功能 (借鉴油猴脚本的 tsindex.ts 模式 + Node 增强)
// ============================================================

// 借鉴油猴脚本的下载策略:
// 油猴版: 直接拼 tsindex.ts → 0.ts, 1.ts ... N.ts (按 10秒/片估算)
// 增强版: 先尝试下载 m3u8 获取真实片段列表, 失败则回退到 tsindex 模式
async function startDownload(index) {
    if (isDownloading) {
        log('已有下载任务在进行中', 'warn');
        return;
    }

    const q = currentQualities[index];
    if (!q) return;

    // 确保保存目录存在
    if (!fs.existsSync(saveDir)) {
        fs.mkdirSync(saveDir, { recursive: true });
        log(`已创建保存目录: ${saveDir}`);
    }

    const safeTitle = cleanFilename(currentTitle || 'video').substring(0, 80);
    const safeQName = cleanFilename(q.name);

    // 三个文件路径 (都在 saveDir 下)
    const tsFile   = path.join(saveDir, `${safeTitle}_${safeQName}.ts`);    // 下载的原始 ts
    const m2tsFile = path.join(saveDir, `${safeTitle}_${safeQName}.m2ts`);  // dec 解密后
    const mp4File  = path.join(saveDir, `${safeTitle}_${safeQName}.mp4`);   // ffmpeg 最终输出

    const isEncrypted = (q.source === 'h5e') || q.name.includes('加密');

    log(`开始下载 [${q.name}]: ${q.url}`);
    log(`保存至: ${tsFile}`);
    if (isEncrypted) {
        log(`加密流: 下载 → dec.exe 解密 → ffmpeg 转 MP4`, 'info');
    }

    isDownloading = true;
    $('progressContainer').style.display = 'block';
    updateProgress(0, '准备下载...');

    try {
        // ---- 第1步: 下载 ts ----
        if (q.url.includes('.m3u8')) {
            await downloadM3U8(q, tsFile);
        } else if (q.url.includes('.mp4') || q.url.includes('.flv')) {
            // 非 m3u8 直接下载, 跳过解密
            await downloadFile(q.url, tsFile, (loaded, total) => {
                const pct = total ? (loaded/total*100) : 0;
                updateProgress(pct, `${(loaded/1024/1024).toFixed(1)}MB`);
            });
            updateProgress(100, '完成!');
            log(`文件下载完成: ${tsFile}`, 'success');
            return; // 非 m3u8 不需要解密
        } else {
            await downloadM3U8(q, tsFile);
        }

        // ---- 第2步: 加密流 → dec.exe 解密 → m2ts ----
        if (isEncrypted) {
            updateProgress(92, '正在调用 dec.exe 解密...');
            log(`dec.exe ${path.basename(tsFile)} → ${path.basename(m2tsFile)}`);
            await runDec(tsFile, m2tsFile);
            log(`dec.exe 解密完成 → ${m2tsFile}`, 'success');

            // ---- 第3步: ffmpeg m2ts → mp4 ----
            updateProgress(96, '正在 ffmpeg 转 MP4...');
            log(`ffmpeg 转换容器: ${path.basename(m2tsFile)} → ${path.basename(mp4File)}`);
            await runFfmpeg([
                '-i', m2tsFile,
                '-c', 'copy',
                '-y',
                mp4File
            ]);
            log(`✅ 全部完成: ${mp4File}`, 'success');
            updateProgress(100, '全部完成!');

            // 清理中间文件 (保留 mp4)
            try { fs.unlinkSync(tsFile); } catch(e) {}
            try { fs.unlinkSync(m2tsFile); } catch(e) {}
            log('已清理中间文件 (.ts / .m2ts)');
        } else {
            // 未加密: 直接 ffmpeg 转 mp4
            updateProgress(95, '正在 ffmpeg 转 MP4...');
            await runFfmpeg([
                '-i', tsFile,
                '-c', 'copy',
                '-y',
                mp4File
            ]);
            log(`✅ 全部完成: ${mp4File}`, 'success');
            updateProgress(100, '全部完成!');
            // 清理 ts
            try { fs.unlinkSync(tsFile); } catch(e) {}
        }

    } catch(e) {
        log(`处理失败: ${e.message}`, 'error');
        console.error(e);
    } finally {
        isDownloading = false;
    }
}

// ---- 主下载流程 (借鉴油猴脚本的 tsindex.ts 模式) ----
// 把所有 ts 片段顺序拼成 .ts 文件 (供后续 dec.exe / ffmpeg 处理)
async function downloadM3U8(q, outputFile) {
    try {
        let segments = [];

        // 策略1: 尝试下载 m3u8 获取片段列表
        try {
            log('尝试下载 m3u8 索引...');
            const m3u8Content = await fetchText(q.url);

            if (m3u8Content.includes('#EXTM3U')) {
                const parsed = parseM3U8(m3u8Content, q.url);
                if (parsed.length > 0) {
                    segments = parsed;
                    log(`m3u8 解析成功: ${segments.length} 个片段`, 'success');
                }
            }
        } catch(e) {
            log(`m3u8 直接下载失败: ${e.message}, 尝试 tsindex 模式`, 'warn');
        }

        // 策略2: tsindex.ts 模式 (油猴脚本核心方式)
        if (segments.length === 0) {
            const totalSec = Number(apiData?.video?.totalLength || 0);
            if (totalSec > 0) {
                const maxIndex = Math.max(0, Math.ceil(totalSec / 10) - 1);
                const estimated = maxIndex + 1;
                log(`使用 tsindex 模式, 总时长 ${totalSec}s, 预估 ${estimated} 个片段`);

                let urlObj = new URL(q.url);
                urlObj.search = '';
                let pathArr = urlObj.pathname.split('/');
                pathArr[pathArr.length - 1] = 'tsindex.ts';
                urlObj.pathname = pathArr.join('/');
                const baseUrl = urlObj.toString().replace('tsindex.ts', '');

                for (let i = 0; i <= maxIndex; i++) {
                    segments.push(baseUrl + i + '.ts');
                }
                log(`生成 ${segments.length} 个 ts 片段 URL`, 'success');
            }
        }

        if (segments.length === 0) {
            throw new Error('无法获取片段列表 (m3u8 和 tsindex 均失败)');
        }

        // 流式拼接写入
        const ws = fs.createWriteStream(outputFile);
        let completed = 0;
        const total = segments.length;
        let successCount = 0;

        for (let i = 0; i < total; i++) {
            const segUrl = segments[i];
            try {
                const buf = await fetchBinary(segUrl);
                ws.write(buf);
                successCount++;
            } catch(e) {
                log(`片段 ${i} 失败: ${e.message}`, 'warn');
            }

            completed++;
            const pct = (completed / total * 100).toFixed(1);
            updateProgress(pct, `下载片段 ${completed}/${total}`);
        }

        ws.end();
        await new Promise(resolve => ws.on('finish', resolve));

        log(`下载完成: ${successCount}/${total} 片段 → ${path.basename(outputFile)}`, 'success');
        updateProgress(90, '下载完成, 准备解密...');

    } catch(e) {
        throw e;
    }
}

// ============================================================
// m3u8 解析 (提取 ts 片段 URL 列表)
// ============================================================
function parseM3U8(content, baseUrl) {
    const lines = content.split('\n').map(l => l.trim()).filter(l => l);
    const segments = [];

    for (const line of lines) {
        if (line.startsWith('#')) continue; // 跳过所有注释行
        if (line.length === 0) continue;
        if (line.endsWith('.ts') || line.endsWith('.aac')) {
            segments.push(resolveUrl(baseUrl, line));
        }
    }

    return segments;
}

function resolveUrl(base, relative) {
    try {
        return new URL(relative, base).href;
    } catch(e) {
        if (relative.startsWith('//')) return 'https:' + relative;
        return relative;
    }
}

// ============================================================
// 网络请求工具
// ============================================================
function fetchText(url) {
    return new Promise((resolve, reject) => {
        const lib = url.startsWith('https') ? https : http;
        const req = lib.get(url, {
            headers: {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                'Referer': 'https://tv.cctv.com/',
                'Accept': '*/*'
            }
        }, res => {
            if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                return fetchText(resolveUrl(url, res.headers.location)).then(resolve).catch(reject);
            }
            if (res.statusCode === 403) {
                // 403 时尝试 http
                if (url.startsWith('https')) {
                    return fetchText(url.replace('https:', 'http:')).then(resolve).catch(reject);
                }
                return reject(new Error('HTTP 403'));
            }
            if (res.statusCode !== 200) return reject(new Error(`HTTP ${res.statusCode}`));
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', () => resolve(data));
        });
        req.on('error', reject);
        req.setTimeout(15000, () => { req.destroy(new Error('请求超时')); });
    });
}

function fetchBinary(url) {
    return new Promise((resolve, reject) => {
        const lib = url.startsWith('https') ? https : http;
        const req = lib.get(url, {
            headers: {
                'User-Agent': 'Mozilla/5.0',
                'Accept': '*/*'
            }
        }, res => {
            if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                return fetchBinary(resolveUrl(url, res.headers.location)).then(resolve).catch(reject);
            }
            if (res.statusCode === 403 && url.startsWith('https')) {
                return fetchBinary(url.replace('https:', 'http:')).then(resolve).catch(reject);
            }
            const chunks = [];
            res.on('data', chunk => chunks.push(chunk));
            res.on('end', () => resolve(Buffer.concat(chunks)));
        });
        req.on('error', reject);
        req.setTimeout(30000, () => { req.destroy(new Error('下载超时')); });
    });
}

// 普通文件下载 (带进度)
function downloadFile(url, filepath, onProgress) {
    return new Promise((resolve, reject) => {
        const lib = url.startsWith('https') ? https : http;
        const fileStream = fs.createWriteStream(filepath);
        let downloaded = 0;
        let total = 0;

        const req = lib.get(url, {
            headers: {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                'Referer': 'https://tv.cctv.com/'
            }
        }, res => {
            if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                fileStream.close();
                try { fs.unlinkSync(filepath); } catch(e) {}
                return downloadFile(resolveUrl(url, res.headers.location), filepath, onProgress)
                    .then(resolve).catch(reject);
            }
            if (res.statusCode !== 200) return reject(new Error(`HTTP ${res.statusCode}`));
            total = parseInt(res.headers['content-length'] || '0');
            res.on('data', chunk => {
                downloaded += chunk.length;
                if (onProgress) onProgress(downloaded, total);
            });
            res.pipe(fileStream);
            fileStream.on('finish', () => { fileStream.close(); resolve(filepath); });
        });
        req.on('error', err => {
            fileStream.close();
            try { fs.unlinkSync(filepath); } catch(e) {}
            reject(err);
        });
        req.setTimeout(30000, () => { req.destroy(new Error('下载超时')); });
    });
}

// ============================================================
// 调用 dec.exe 解密 (dec.exe 与 index.html 同目录)
// 用法: dec.exe input.ts output.m2ts
// ============================================================
function runDec(inFile, outFile) {
    return new Promise((resolve, reject) => {
        // dec.exe 与 index.html 同目录 (即 nw 应用根目录)
        const decPath = path.join(appDir, 'package.nw', 'dec.exe');

        if (!fs.existsSync(decPath)) {
            return reject(new Error(`dec.exe 未找到: ${decPath}`));
        }

        log(`执行: dec.exe ${path.basename(inFile)} ${path.basename(outFile)}`);

        const proc = spawn(decPath, [inFile, outFile], { cwd: saveDir });
        let stderr = '';
        proc.stderr.on('data', d => { stderr += d.toString(); });
        proc.stdout.on('data', d => { log(`[dec] ${d.toString().trim()}`); });
        proc.on('close', code => {
            if (code === 0 && fs.existsSync(outFile)) {
                const size = (fs.statSync(outFile).size / 1024 / 1024).toFixed(1);
                resolve(outFile);
            } else {
                reject(new Error(`dec.exe 退出码 ${code}: ${stderr.slice(-300)}`));
            }
        });
        proc.on('error', reject);
    });
}

// ============================================================
// 调用 ffmpeg 转容器 (ffmpeg 与 index.html 同目录)
// ============================================================
function runFfmpeg(args) {
    return new Promise((resolve, reject) => {
        const ffPath = path.join(appDir, 'package.nw', 'ffmpeg.exe');

        // 优先用同目录的 ffmpeg, 其次走 PATH
        const bin = fs.existsSync(ffPath) ? ffPath : 'ffmpeg';
        const label = fs.existsSync(ffPath) ? 'ffmpeg.exe' : 'ffmpeg(PATH)';
        log(`执行: ${label} ${args.join(' ')}`);

        const proc = spawn(bin, args, { cwd: saveDir });
        let stderr = '';
        proc.stderr.on('data', d => {
            const text = d.toString();
            stderr += text;
            const m = text.match(/time=(\d+:\d+:\d+\.\d+)/);
            if (m) $('progressDetail').textContent = `${label}: ${m[1]}`;
        });
        proc.on('close', code => {
            if (code === 0) resolve();
            else reject(new Error(`${label} 退出码 ${code}: ${stderr.slice(-300)}`));
        });
        proc.on('error', reject);
    });
}

// 进度条
function updateProgress(percent, detail) {
    const pct = Math.min(100, Math.max(0, parseFloat(percent) || 0));
    $('progressFill').style.width = pct + '%';
    $('progressText').textContent = pct.toFixed(1) + '%';
    if (detail) $('progressDetail').textContent = detail;
}
