<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV视频下载器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- 顶部标题栏 -->
    <header class="app-header">
      <div class="header-icon">📺</div>
      <h1>CCTV 视频下载器</h1>
    </header>

    <!-- URL 输入区 -->
    <section class="input-section">
      <label class="input-label">视频链接</label>
      <div class="input-row">
        <input type="text" id="urlInput" class="url-input"
               placeholder="粘贴央视网视频链接，例如: https://tv.cctv.com/..."
               spellcheck="false" autocomplete="off">
        <button id="parseBtn" class="btn btn-primary">解析</button>
      </div>
      <div class="hint">支持域名: cctv.com · cctv.cn · cntv.cn</div>
    </section>

    <!-- 视频信息 -->
    <section class="result-section" id="videoInfoSection" style="display:none;">
      <div class="result-header">
        <span>视频信息</span>
        <span class="badge" id="apiBadge">-</span>
      </div>
      <div class="result-body video-info-body">
        <div class="video-cover-wrap" id="videoCoverWrap" style="display:none;"></div>
        <div class="video-info-grid" id="videoInfoGrid"></div>
      </div>
    </section>

    <!-- 保存目录 -->
    <div class="save-dir-row">
      <label class="input-label">保存到</label>
      <div class="dir-row">
        <input type="text" id="saveDirInput" class="dir-input" readonly>
        <button id="changeDirBtn" class="btn btn-small">更改</button>
        <button id="openFolderBtn" class="btn btn-small">打开</button>
      </div>
    </div>

    <!-- 进度条 -->
    <div class="progress-container" id="progressContainer" style="display:none;">
      <div class="progress-bar" id="progressBar"></div>
      <div class="progress-text" id="progressText">0%</div>
    </div>

    <!-- 清晰度列表 -->
    <section class="result-section" id="qualitySection" style="display:none;">
      <div class="result-header">
        <span>可用清晰度 & 下载</span>
        <span class="quality-count" id="qualityCount"></span>
      </div>
      <div class="result-body">
        <div class="quality-list" id="qualityList"></div>
      </div>
    </section>

    <!-- 状态栏 -->
    <div class="status-bar status-info" id="statusArea">就绪</div>

    <!-- 日志区 -->
    <section class="log-section">
      <div class="log-header">运行日志</div>
      <div class="log-area" id="logArea"></div>
    </section>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
