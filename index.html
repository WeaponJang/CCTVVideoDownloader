<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS视频解密合并工具</title>
<style>
:root {
  --bg: #f3ede4;
  --bg-surface: #ebe4d8;
  --bg-card: #f7f2ea;
  --bg-input: #efe8dc;
  --fg: #2c2824;
  --fg-muted: #6b635a;
  --fg-dim: #9e958a;
  --accent: #8b4513;
  --accent-glow: rgba(139, 69, 19, 0.12);
  --success: #4a7c59;
  --error: #8b3a3a;
  --warning: #7a6830;
  --border: #d6cfc3;
  --radius: 10px;
  --font-ui: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "Cascadia Code", "Consolas", "Courier New", monospace;
}

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--fg);
  min-height: 96vh;
  overflow: overlay;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(139, 120, 90, 0.015) 3px,
      rgba(139, 120, 90, 0.015) 4px
    ),
    radial-gradient(ellipse 800px 600px at 30% 40%, rgba(180, 160, 120, 0.08) 0%, transparent 70%),
    radial-gradient(ellipse 600px 500px at 75% 70%, rgba(160, 140, 100, 0.06) 0%, transparent 70%);
  pointer-events: none;
}

.app-container {
  position: relative; z-index: 1;
  max-width: 800px; margin: 0 auto; padding: 10px 0px 10px;
}
.app-header { text-align: center; margin-bottom: 2px; }
.app-header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 2px; }
.app-header h1 .dot { color: var(--accent); }
.app-header p { font-size: 13px; color: var(--fg-muted); }

.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 4px; margin-bottom: 6px;
  transition: border-color .3s;
}
.card:hover { border-color: #c5bdb0; }
.card-label {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: var(--fg-muted); margin-bottom: 2px;
  display: flex; align-items: center; gap: 6px;
}
.card-label .icon {
  width: 16px; height: 16px; display: inline-flex; align-items: center;
  justify-content: center; background: var(--accent-glow); border-radius: 4px;
  font-size: 10px; color: var(--accent);
}

.file-row { display: flex; gap: 10px; align-items: stretch; }
.path-input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px 4px; color: var(--fg); font-size: 16px;
  font-family: var(--font-mono); outline: none; transition: border-color .2s;
}
.path-input:focus { border-color: var(--accent); }
.path-input::placeholder { color: var(--fg-dim); }
.path-input:read-only { color: var(--fg); }

.drop-zone {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 8px 2px; text-align: center; cursor: pointer;
  transition: all .3s; margin-bottom: 2px;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--accent); background: rgba(139, 69, 19, 0.04);
}
.drop-icon {
  font-size: 28px; margin-bottom: 8px; display: block;
  color: var(--fg-dim); transition: color .3s;
}
.drop-zone:hover .drop-icon { color: var(--accent); }
.drop-text { font-size: 13px; color: var(--fg-muted); line-height: 1.6; }
.drop-text strong { color: var(--accent); font-weight: 600; }

.file-info {
  display: none; background: var(--bg-input);
  border-radius: 8px; padding: 12px 16px; gap: 16px;
  flex-wrap: wrap; align-items: center;
}
.file-info.visible { display: flex; }
.file-info .info-item { font-size: 12px; color: var(--fg-muted); }
.file-info .info-item span { color: var(--fg); font-weight: 600; margin-left: 4px; }
.file-info .file-name {
  flex: 1 1 100%; font-size: 13px; color: var(--fg); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 8px; border: none; border-radius: 8px; font-size: 16px;
  font-weight: 600; cursor: pointer; transition: all .2s; white-space: nowrap;
  font-family: var(--font-ui);
}
.btn-outline {
  background: transparent; border: 1px solid var(--border); color: var(--fg-muted);
}
.btn-outline:hover {
  border-color: var(--accent); color: var(--accent);
  background: rgba(139, 69, 19, 0.06);
}
.btn-primary {
  background: var(--accent); color: #f3ede4;
  box-shadow: 0 2px 16px var(--accent-glow);
}
.btn-primary:hover:not(:disabled) {
  background: #a0522d; box-shadow: 0 4px 24px var(--accent-glow);
  transform: translateY(-1px);
}
.btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn-danger {
  background: rgba(139, 58, 58, 0.08); border: 1px solid rgba(139, 58, 58, 0.2);
  color: var(--error);
}
.btn-danger:hover { background: rgba(139, 58, 58, 0.14); }

.progress-section { display: none; margin-bottom: 16px; }
.progress-section.visible { display: block; }
.progress-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
}
.progress-step { font-size: 16px; font-weight: 600; }
.progress-percent {
  font-size: 13px; font-weight: 700; color: var(--accent); font-family: var(--font-mono);
}
.progress-bar-track {
  width: 100%; height: 6px; background: var(--bg-input);
  border-radius: 3px; overflow: hidden; margin-bottom: 6px;
}
.progress-bar-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), #a0522d);
  border-radius: 3px; transition: width .35s ease; position: relative;
}
.progress-bar-fill::after {
  content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 40px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15)); border-radius: 3px;
}
.progress-sub {
  font-size: 11px; color: var(--fg-dim); display: flex; justify-content: space-between;
}
.progress-sub .eta { color: var(--fg-muted); }

.steps-indicator { display: flex; gap: 4px; margin-bottom: 16px; }
.step-dot {
  flex: 1; height: 3px; background: var(--border); border-radius: 2px; transition: background .4s;
}
.step-dot.done { background: var(--success); }
.step-dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }

.log-card {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; margin-top: 20px;
}
.log-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px; background: var(--bg-card); border-bottom: 1px solid var(--border);
}
.log-header span {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: var(--fg-muted);
}
.log-body {
  height: 250px; overflow-y: auto; padding: 4px 4px;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.7;
  color: var(--fg-muted); scroll-behavior: smooth;
}
.log-body::-webkit-scrollbar { width: 5px; }
.log-body::-webkit-scrollbar-track { background: transparent; }
.log-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.log-line { display: block; }
.log-line.normal { color: var(--fg-muted); }
.log-line.success { color: var(--success); font-weight: 600; }
.log-line.error { color: var(--error); font-weight: 600; }
.log-line.warning { color: var(--warning); }
.log-line.info { color: #4a6a8a; }
.log-line.cmd { color: var(--fg-dim); font-style: italic; }

.action-bar { display: flex; gap: 10px; margin-top: 20px; }
.action-bar .btn { flex: 1; padding: 14px 20px; font-size: 14px; }
.btn-cancel { display: none; }
.btn-cancel.visible { display: inline-flex; }

.toast-container {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  display: flex; flex-direction: column; gap: 10px;
}
.toast {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 20px; min-width: 280px; max-width: 400px;
  box-shadow: 0 8px 32px rgba(60, 50, 30, 0.15); animation: toastIn .35s ease;
  display: flex; align-items: flex-start; gap: 10px;
}
.toast.toast-out { animation: toastOut .3s ease forwards; }
.toast-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.toast-body { flex: 1; }
.toast-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.toast-msg { font-size: 12px; color: var(--fg-muted); line-height: 1.5; white-space: pre-line; }
.toast.success .toast-icon { color: var(--success); }
.toast.error .toast-icon { color: var(--error); }
.toast.warning .toast-icon { color: var(--warning); }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(40px) scale(.95); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}
@keyframes toastOut {
  from { opacity: 1; transform: translateX(0) scale(1); }
  to { opacity: 0; transform: translateX(40px) scale(.95); }
}

.tool-status { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.tool-badge {
  font-size: 11px; padding: 4px 10px; border-radius: 6px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 5px;
}
.tool-badge.ok {
  background: rgba(74, 124, 89, 0.1); color: var(--success);
  border: 1px solid rgba(74, 124, 89, 0.2);
}
.tool-badge.fail {
  background: rgba(139, 58, 58, 0.1); color: var(--error);
  border: 1px solid rgba(139, 58, 58, 0.2);
}
.tool-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.result-stats { display: none; gap: 12px; margin-bottom: 16px; }
.result-stats.visible { display: grid; grid-template-columns: repeat(3, 1fr); }
.stat-box { background: var(--bg-input); border-radius: 8px; padding: 14px; text-align: center; }
.stat-box .stat-value { font-size: 20px; font-weight: 800; font-family: var(--font-mono); color: var(--fg); }
.stat-box .stat-label { font-size: 11px; color: var(--fg-dim); margin-top: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>

<!-- 静态 input，与原始代码一致，放在 body 最前面 -->
<input type="file" id="filePicker" accept=".ts,.mpegts" style="position:absolute;left:-9999px;top:-9999px;">
<input type="file" id="dirPicker" nwdirectory style="position:absolute;left:-9999px;top:-9999px;">

<div class="toast-container" id="toastContainer"></div>

<div class="app-container">
  <header class="app-header">
    <h1>H5E接口视频解密合并工具<span class="dot">1.0</span></h1>
  </header>

  <div class="tool-status" id="toolStatus"></div>

  <div class="steps-indicator" id="stepsIndicator">
    <div class="step-dot"></div>
    <div class="step-dot"></div>
    <div class="step-dot"></div>
    <div class="step-dot"></div>
    <div class="step-dot"></div>
  </div>

  <!-- 视频文件 -->
  <div class="card">
    <div class="card-label"><span class="icon">F</span> 视频文件</div>
    <div class="drop-zone" id="dropZone">
      <span class="drop-icon">&#9650;</span>
      <div class="drop-text">拖拽 <strong>.ts / .mpegts</strong> 文件到此处<br>或点击下方按钮选择</div>
    </div>
    <div class="file-row">
      <input type="text" class="path-input" id="inputFilePath" placeholder="未选择文件..." readonly>
      <button class="btn btn-outline" id="selectFileBtn">浏览</button>
    </div>
    <div class="file-info" id="fileInfo">
      <div class="file-name" id="infoName"></div>
      <div class="info-item">大小:<span id="infoSize"></span></div>
      <div class="info-item">时长:<span id="infoDuration"></span></div>
      <div class="info-item">预计切片:<span id="infoSegments"></span></div>
    </div>
  </div>

  <!-- 保存路径 -->
  <div class="card">
    <div class="card-label"><span class="icon">S</span> 保存路径</div>
    <div class="file-row">
      <input type="text" class="path-input" id="savePath" placeholder="选择输出目录..." readonly>
      <button class="btn btn-outline" id="selectDirBtn">浏览</button>
    </div>
  </div>

  <!-- 进度 -->
  <div class="progress-section" id="progressSection">
    <div class="card" style="padding:18px 24px;">
      <div class="progress-header">
        <span class="progress-step" id="progressStep">准备中...</span>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="progress-sub">
        <span id="progressDetail"></span>
        <span class="eta" id="progressEta"></span>
      </div>
    </div>
  </div>

  <!-- 统计 -->
  <div class="result-stats" id="resultStats">
    <div class="stat-box"><div class="stat-value" id="statSegments">-</div><div class="stat-label">切片总数</div></div>
    <div class="stat-box"><div class="stat-value" id="statDecrypted">-</div><div class="stat-label">解密成功</div></div>
    <div class="stat-box"><div class="stat-value" id="statTime">-</div><div class="stat-label">总耗时</div></div>
  </div>

  <!-- 操作 -->
  <div class="action-bar">
    <button class="btn btn-primary" id="startBtn" disabled>开始处理</button>
    <button class="btn btn-danger btn-cancel" id="cancelBtn">取消任务</button>
  </div>

  <!-- 日志 -->
  <div class="log-card">
    <div class="log-header">
      <span>运行日志</span>
      <button class="btn btn-outline" id="clearLogBtn" style="padding:4px 10px;font-size:11px;">清空</button>
    </div>
    <div class="log-body" id="log"></div>
  </div>
</div>

<script>
const fs = require('fs');
const path = require('path');
const { exec } = require('child_process');

// ========== 路径配置 ==========
const appDir = nw.App.startPath;
const binDir = path.join(appDir, 'package.nw');
const ffmpegPath = path.join(binDir, 'ffmpeg.exe');
const decPath = path.join(binDir, 'dec.exe');

// ========== 获取 UI 元素（与原始代码一致） ==========
const inputFilePathInput = document.getElementById('inputFilePath');
const selectFileBtn = document.getElementById('selectFileBtn');
const filePickerInput = document.getElementById('filePicker');
const dirPickerInput = document.getElementById('dirPicker');
const savePathInput = document.getElementById('savePath');
const startBtn = document.getElementById('startBtn');
const logDiv = document.getElementById('log');

let selectedFile = null;
let cancelRequested = false;
let taskStartTime = 0;

// ========== 工具链预检 ==========
(() => {
  const tools = [
    { name: 'ffmpeg.exe', p: ffmpegPath },
    { name: 'dec.exe', p: decPath },
  ];
  const el = document.getElementById('toolStatus');
  let allOk = true;
  for (const t of tools) {
    const ok = fs.existsSync(t.p);
    if (!ok) allOk = false;
    const badge = document.createElement('span');
    badge.className = `tool-badge ${ok ? 'ok' : 'fail'}`;
    badge.innerHTML = `<span class="dot"></span>${t.name}`;
    el.appendChild(badge);
  }
  if (!allOk) {
    logMsg('package.nw 目录中缺少必要工具文件', 'error');
    showToast('工具缺失', '请确认 package.nw 中包含 ffmpeg.exe 和 dec.exe', 'error');
  }
})();

// ========== Toast ==========
function showToast(title, msg, type = 'success') {
  const icons = { success: '✓', error: '✗', warning: '!' };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span class="toast-icon">${icons[type] ?? '·'}</span><div class="toast-body"><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>`;
  document.getElementById('toastContainer').appendChild(toast);
  setTimeout(() => {
    toast.classList.add('toast-out');
    setTimeout(() => toast.remove(), 300);
  }, 5000);
}

// ========== 日志 ==========
function logMsg(msg, type = 'normal') {
  const line = document.createElement('span');
  line.className = `log-line ${type}`;
  const ts = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  line.textContent = `[${ts}] ${msg}\n`;
  logDiv.appendChild(line);
  logDiv.scrollTop = logDiv.scrollHeight;
}
document.getElementById('clearLogBtn').addEventListener('click', () => { logDiv.innerHTML = ''; });

// ========== 进度 ==========
function setProgress(step, percent, detail, eta) {
  document.getElementById('progressSection').classList.add('visible');
  document.getElementById('progressStep').textContent = step;
  document.getElementById('progressPercent').textContent = Math.round(percent) + '%';
  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('progressDetail').textContent = detail ?? '';
  document.getElementById('progressEta').textContent = (eta != null && eta > 0) ? `预计剩余 ${fmtTime(eta)}` : '';
}
function setStep(i) {
  document.getElementById('stepsIndicator').querySelectorAll('.step-dot').forEach((d, idx) => {
    d.classList.remove('done', 'active');
    if (idx < i) d.classList.add('done');
    else if (idx === i) d.classList.add('active');
  });
}
function fmtTime(s) {
  if (s < 60) return `${Math.ceil(s)}秒`;
  return `${Math.floor(s / 60)}分${Math.ceil(s % 60)}秒`;
}
function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(2) + ' GB';
}

// ============================================================
// 文件选择 — 完全照搬原始代码逻辑
// ============================================================
selectFileBtn.addEventListener('click', () => filePickerInput.click());

filePickerInput.addEventListener('change', (event) => {
  if (event.target.files.length > 0) {
    const filePath = event.target.files[0].path;
    handleFilePath(filePath);
  }
});

// 拖拽区域点击也走同一个 input
document.getElementById('dropZone').addEventListener('click', () => filePickerInput.click());

// 拖拽文件
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('drag-over'); });
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const f = e.dataTransfer.files?.[0];
  if (f?.path) handleFilePath(f.path);
  else showToast('无法获取路径', '拖拽文件未能获取本地路径', 'warning');
});

function handleFilePath(filePath) {
  const ext = path.extname(filePath).toLowerCase();
  if (ext !== '.ts' && ext !== '.mpegts') {
    showToast('格式不支持', '仅支持 .ts 或 .mpegts 文件', 'warning');
    return;
  }
  if (!fs.existsSync(filePath)) {
    showToast('文件不存在', '请确认文件路径有效', 'error');
    return;
  }

  // 与原始代码一致的赋值方式
  inputFilePathInput.value = filePath;
  savePathInput.value = path.dirname(filePath);
  selectedFile = filePath;

  const stat = fs.statSync(filePath);
  document.getElementById('infoName').textContent = path.basename(filePath);
  document.getElementById('infoSize').textContent = fmtSize(stat.size);
  document.getElementById('fileInfo').classList.add('visible');
  document.getElementById('infoDuration').textContent = '分析中...';
  document.getElementById('infoSegments').textContent = '-';

  getVideoDuration(filePath).then((dur) => {
    document.getElementById('infoDuration').textContent = fmtTime(dur);
    document.getElementById('infoSegments').textContent = `${Math.ceil(dur / 30)} 段`;
    startBtn.disabled = false;
  }).catch((err) => {
    document.getElementById('infoDuration').textContent = '未知';
    logMsg(err.message, 'warning');
    startBtn.disabled = false;
  });

  logMsg(`已选择文件: ${path.basename(filePath)} (${fmtSize(stat.size)})`, 'info');
}

// ============================================================
// 目录选择 — 与文件选择同样的静态 input 方式
// ============================================================
document.getElementById('selectDirBtn').addEventListener('click', () => dirPickerInput.click());

dirPickerInput.addEventListener('change', (event) => {
  if (event.target.files.length > 0) {
    // nwdirectory 模式下 files[0].path 就是所选目录路径
    const dirPath = event.target.files[0].path;
    savePathInput.value = dirPath;
    logMsg(`保存路径: ${dirPath}`, 'info');
  }
});

// ========== 取消 ==========
document.getElementById('cancelBtn').addEventListener('click', () => {
  if (confirm('确定要取消当前任务吗？临时文件将被保留以便检查。')) {
    cancelRequested = true;
    logMsg('用户请求取消任务...', 'warning');
  }
});

// ========== 异步命令执行 ==========
function runCmdAsync(cmd, cwd) {
  return new Promise((resolve, reject) => {
    logMsg(`> ${cmd}`, 'cmd');
    exec(cmd, { cwd, encoding: 'utf-8', windowsHide: true, maxBuffer: 10 * 1024 * 1024 }, (error, stdout, stderr) => {
      if (cancelRequested) return reject(new Error('任务已取消'));
      if (error) {
        const errMsg = (stderr || error.message || '').trim();
        logMsg(`命令错误: ${errMsg}`, 'error');
        return reject(new Error(errMsg || '外部命令执行失败'));
      }
      if (stdout?.trim()) logMsg(stdout.trim());
      if (stderr?.trim() && !/^(frame=|size=|speed=)/.test(stderr.trim())) {
        logMsg(stderr.trim(), 'warning');
      }
      resolve(stdout);
    });
  });
}

// ========== 获取视频时长 ==========
function getVideoDuration(filePath) {
  return new Promise((resolve, reject) => {
    exec(`"${ffmpegPath}" -hide_banner -i "${filePath}" 2>&1`, { windowsHide: true, maxBuffer: 8 * 1024 * 1024 }, (error, stdout, stderr) => {
      const m = (stderr || stdout || '').match(/Duration:\s*(\d{2}):(\d{2}):(\d{2})\.(\d{2})/);
      if (m) {
        resolve(parseInt(m[1]) * 3600 + parseInt(m[2]) * 60 + parseInt(m[3]) + parseInt(m[4]) / 100);
      } else {
        reject(new Error('无法解析视频时长，文件可能已损坏或格式不支持'));
      }
    });
  });
}

// ========== 并发控制器 ==========
async function runConcurrent(items, concurrency, handler) {
  let idx = 0;
  const workers = Array.from({ length: Math.min(concurrency, items.length) }, async () => {
    while (idx < items.length) {
      if (cancelRequested) return;
      const cur = idx++;
      try { await handler(items[cur], cur); }
      catch (err) { if (err.message === '任务已取消') return; }
    }
  });
  await Promise.all(workers);
}

// ========== 带进度的切片 ==========
function runSliceWithProgress(cmd, cwd, totalDuration, stepName) {
  return new Promise((resolve, reject) => {
    logMsg(`> ${cmd}`, 'cmd');
    const proc = exec(cmd, { cwd, windowsHide: true, maxBuffer: 10 * 1024 * 1024 }, (error, stdout, stderr) => {
      if (cancelRequested) return reject(new Error('任务已取消'));
      if (error) return reject(new Error((stderr || error.message || '').trim() || '切片失败'));
      resolve(stdout);
    });
    proc.stderr.on('data', (data) => {
      if (cancelRequested) { proc.kill(); return; }
      const m = data.toString().match(/time=(\d{2}):(\d{2}):(\d{2})\.(\d{2})/);
      if (m) {
        const sec = parseInt(m[1]) * 3600 + parseInt(m[2]) * 60 + parseInt(m[3]) + parseInt(m[4]) / 100;
        setProgress(stepName, Math.min(99, sec / totalDuration * 100), `已处理 ${fmtTime(sec)} / ${fmtTime(totalDuration)}`);
      }
    });
  });
}

// ========== 带进度的合并 ==========
function runMergeWithProgress(cmd, cwd, outputPath, estimatedSize, stepName) {
  return new Promise((resolve, reject) => {
    logMsg(`> ${cmd}`, 'cmd');
    const timer = setInterval(() => {
      if (cancelRequested) { clearInterval(timer); return; }
      try {
        if (fs.existsSync(outputPath)) {
          const cur = fs.statSync(outputPath).size;
          setProgress(stepName, Math.min(95, cur / Math.max(estimatedSize, 1) * 100),
            `已写入 ${fmtSize(cur)} / ${fmtSize(estimatedSize)}`);
        }
      } catch { /* ignore */ }
    }, 500);
    exec(cmd, { cwd, windowsHide: true, maxBuffer: 10 * 1024 * 1024 }, (error, stdout, stderr) => {
      clearInterval(timer);
      if (cancelRequested) return reject(new Error('任务已取消'));
      if (error) return reject(new Error((stderr || error.message || '').trim() || '合并失败'));
      setProgress(stepName, 100, '合并完成');
      resolve(stdout);
    });
  });
}

// ========== 主流程 ==========
const STEPS = ['分析视频文件', '切片处理中', '解密切片中', '合并MP4中', '清理临时文件'];

startBtn.addEventListener('click', async () => {
  const inputFile = inputFilePathInput.value.trim();
  if (!inputFile || !fs.existsSync(inputFile)) {
    showToast('请选择文件', '未选择有效的TS视频文件', 'warning');
    return;
  }
  if (!inputFile.toLowerCase().endsWith('.ts') && !inputFile.toLowerCase().endsWith('.mpegts')) {
    showToast('格式不支持', '请选择 .ts 或 .mpegts 格式的视频文件', 'warning');
    return;
  }
  const targetDir = savePathInput.value.trim();
  if (!targetDir || !fs.existsSync(targetDir)) {
    showToast('请选择保存路径', '输出目录无效或不存在', 'warning');
    return;
  }
  if (!fs.existsSync(ffmpegPath) || !fs.existsSync(decPath)) {
    showToast('工具缺失', '请检查 package.nw 目录', 'error');
    return;
  }

  cancelRequested = false;
  taskStartTime = Date.now();
  startBtn.disabled = true;
  document.getElementById('cancelBtn').classList.add('visible');
  document.getElementById('resultStats').classList.remove('visible');
  logDiv.innerHTML = '';

  const fileNameWithoutExt = path.basename(inputFile, path.extname(inputFile));
  const clean = s => s.replace(/[\u005c\u002f\u003a\u002a\u003f\u003c\u003e\u007c\u0020\u0022\u0027\u3000\uff02\uff07《》]/g, '_');
  const safeTitle = clean(fileNameWithoutExt);
  const tempDir = path.join(targetDir, `temp_${safeTitle}`);
  const SEG_DUR = 30;

  try {
    // 步骤 1: 分析
    setStep(0);
    setProgress(STEPS[0], 0, '正在读取视频信息...');
    logMsg('>>> 启动处理任务', 'info');

    const totalDuration = await getVideoDuration(inputFile);
    const totalSegments = Math.ceil(totalDuration / SEG_DUR);
    logMsg(`分析完成: 文件 "${path.basename(inputFile)}" | 总时长: ${totalDuration.toFixed(2)}秒 | 预计切片数: ${totalSegments}`, 'info');
    setProgress(STEPS[0], 100, `分析完成，共 ${totalSegments} 个切片`);

    if (fs.existsSync(tempDir)) fs.rmSync(tempDir, { recursive: true, force: true });
    fs.mkdirSync(tempDir, { recursive: true });
    logMsg(`已创建临时工作目录: ${tempDir}`, 'info');

    // 步骤 2: 切片
    setStep(1);
    setProgress(STEPS[1], 0, 'ffmpeg 正在切片...');
    logMsg(`[2/5] 正在使用ffmpeg进行切片 (每段${SEG_DUR}秒)...`);
    const tsPattern = path.join(tempDir, '_%05d.ts');
    await runSliceWithProgress(
      `"${ffmpegPath}" -y -hide_banner -i "${inputFile}" -c copy -map 0 -f segment -segment_time ${SEG_DUR} -break_non_keyframes 0 "${tsPattern}"`,
      binDir, totalDuration, STEPS[1]
    );
    const tsFiles = fs.readdirSync(tempDir).filter(f => f.endsWith('.ts')).sort();
    if (!tsFiles.length) throw new Error('切片失败：未生成任何 .ts 文件');
    logMsg('视频切片完成。', 'success');

    // 步骤 3: 并发解密
    setStep(2);
    logMsg('[3/5] 正在通过 dec.exe 解密切片...');
    let decryptedCount = 0, failedCount = 0;
    const t3 = Date.now();

    await runConcurrent(tsFiles, 4, async (tsFile) => {
      if (cancelRequested) throw new Error('任务已取消');
      const tsPath = path.join(tempDir, tsFile);
      const mp4Path = path.join(tempDir, tsFile.replace(/\.ts$/i, '.MP4'));
      try {
        await runCmdAsync(`"${decPath}" "${tsPath}" "${mp4Path}"`, binDir);
        if (!fs.existsSync(mp4Path) || fs.statSync(mp4Path).size === 0) throw new Error('解密后未生成有效MP4');
        decryptedCount++;
      } catch (err) {
        if (cancelRequested) throw new Error('任务已取消');
        failedCount++;
        logMsg(`解密 ${tsFile} 时出错: ${err.message}`, 'error');
      }
      const done = decryptedCount + failedCount;
      const elapsed = (Date.now() - t3) / 1000;
      setProgress(STEPS[2], done / tsFiles.length * 100,
        `成功 ${decryptedCount} / 失败 ${failedCount} / 共 ${tsFiles.length}`,
        (tsFiles.length - done) / (done / Math.max(elapsed, 0.1))
      );
    });
    if (cancelRequested) throw new Error('任务已取消');
    if (!decryptedCount) throw new Error('没有成功解密的 MP4 文件，无法合并。');
    logMsg(`切片解密完成 (成功: ${decryptedCount}/${tsFiles.length} 个)。`, failedCount ? 'warning' : 'success');

    // 步骤 4: 合并
    setStep(3);
    setProgress(STEPS[3], 0, '生成文件列表...');
    logMsg('[4/5] 正在生成列表并调用 ffmpeg 合并...');
    const mp4Files = fs.readdirSync(tempDir).filter(f => f.toUpperCase().endsWith('.MP4')).sort();
    const listPath = path.join(tempDir, 'filelist.txt');
    let listContent = '';
    for (const mp4File of mp4Files) { listContent += `file ${mp4File}\n`; }
    fs.writeFileSync(listPath, listContent, 'utf-8');
    logMsg(`列表文件已生成，包含 ${mp4Files.length} 个文件。`);

    const finalOutputPath = path.join(targetDir, `${safeTitle}_new.mp4`);
    if (fs.existsSync(finalOutputPath)) fs.unlinkSync(finalOutputPath);
    setProgress(STEPS[3], 20, 'ffmpeg 正在合并...');
    const totalMp4Size = mp4Files.reduce((s, f) => s + fs.statSync(path.join(tempDir, f)).size, 0);
    await runMergeWithProgress(
      `"${ffmpegPath}" -y -hide_banner -f concat -safe 0 -i filelist.txt -c copy -movflags +faststart -fflags +genpts -avoid_negative_ts make_zero "${finalOutputPath}"`,
      tempDir, finalOutputPath, totalMp4Size, STEPS[3]
    );
    if (!fs.existsSync(finalOutputPath) || !fs.statSync(finalOutputPath).size) throw new Error('合并后输出文件为空');
    const outStat = fs.statSync(finalOutputPath);
    logMsg(`合并完成: ${path.basename(finalOutputPath)} (${fmtSize(outStat.size)})`, 'success');

    // 步骤 5: 清理
    setStep(4);
    setProgress(STEPS[4], 50, '正在删除临时文件...');
    logMsg('[5/5] 正在清理临时文件...');
    try { fs.rmSync(tempDir, { recursive: true, force: true }); logMsg('临时文件已清理', 'success'); }
    catch (err) { logMsg(`清理失败: ${err.message}，请手动删除 ${tempDir}`, 'warning'); }

    setProgress(STEPS[4], 100, '全部完成');
    setStep(5);

    const totalTime = ((Date.now() - taskStartTime) / 1000).toFixed(1);
    document.getElementById('statSegments').textContent = tsFiles.length;
    document.getElementById('statDecrypted').textContent = `${decryptedCount}/${tsFiles.length}`;
    document.getElementById('statTime').textContent = totalTime + 's';
    document.getElementById('resultStats').classList.add('visible');
    logMsg(`>>> 全部流程完成！耗时 ${totalTime}秒`, 'success');
    logMsg(`最终文件: ${finalOutputPath}`, 'success');
    showToast('处理完成', `${path.basename(finalOutputPath)} (${fmtSize(outStat.size)})\n耗时 ${totalTime}秒`, 'success');

  } catch (err) {
    if (err.message === '任务已取消') {
      logMsg('>>> 任务已被用户取消', 'warning');
      setProgress('已取消', 0, '任务已取消');
      showToast('已取消', `临时文件保留在: ${tempDir}`, 'warning');
    } else {
      logMsg(`!!! 流程中断 !!!\n${err.message}`, 'error');
      setProgress('出错', 0, err.message.split('\n')[0]);
      showToast('处理失败', err.message.split('\n')[0], 'error');
    }
  } finally {
    startBtn.disabled = false;
    document.getElementById('cancelBtn').classList.remove('visible');
    cancelRequested = false;
  }
});
</script>
